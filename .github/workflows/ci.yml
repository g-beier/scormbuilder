# Testes a cada push em main/feat/** e a cada PR para main: front (vitest, build e
# verificação de segurança no navegador), backend Rust (clippy e testes) e motor do
# pacote (scripts do runtime/test que usam só as fixtures).
# Os testes que dependem de ~/Dev/ead-scorm (teste de ouro, montar/comparar) são
# pulados ou ficam de fora: a pasta não existe no runner.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

# Um push novo no mesmo ref cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências do front
        run: npm ci

      - name: Testes do front
        run: npm test

      - name: Checagem de tipos e build
        run: npm run build

      # Navegadores do Playwright (Chromium e WebKit, o motor do WKWebView do Mac).
      # O cache guarda os binários; as bibliotecas do sistema são instaladas sempre.
      - name: Cache dos navegadores do Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegadores do Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Dependências de sistema do Playwright
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # Mesmo que `npm run verificar-seguranca`, sem repetir o build do passo anterior
      - name: Verificação de segurança (CSP, importação e prévia isoladas)
        run: node scripts/verificar-seguranca.mjs

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Pré-requisitos do Tauri 2 no Linux (https://v2.tauri.app/start/prerequisites/)
      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Sem `dist/`: em build de desenvolvimento (sem a feature custom-protocol) o
      # generate_context! usa o devUrl e não embute o frontendDist.
      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Testes do backend
        run: cargo test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Cache do Chromium do Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium do Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependências de sistema do Chromium
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Em sequência: os scripts montam pacotes na mesma pasta de saída.
      # montar.mjs e comparar.mjs ficam de fora (precisam dos LEITURA2 do ead-scorm).
      - name: Tipos do kit (múltipla, reflexão, escolha)
        run: node runtime/test/tipos-kit.mjs "$RUNNER_TEMP/cev-runtime"

      - name: Categorizar
        run: node runtime/test/categorizar.mjs "$RUNNER_TEMP/cev-runtime"

      - name: Ramificado
        run: node runtime/test/ramificado.mjs "$RUNNER_TEMP/cev-runtime"

      - name: Imagem
        run: node runtime/test/imagem.mjs "$RUNNER_TEMP/cev-runtime"
