# Gera os instaladores (Mac Apple Silicon, Mac Intel e Windows) a cada tag v*
# e anexa a um rascunho de Release no GitHub. Publique o rascunho depois de conferir.
#
# Atualização automática: com bundle.createUpdaterArtifacts, o `tauri build` assina
# os pacotes de atualização (.app.tar.gz no Mac, .msi no Windows) com a chave
# TAURI_SIGNING_PRIVATE_KEY (+ senha) e gera os .sig. O tauri-action sobe os .sig e
# monta um único latest.json no release: cada job da matriz baixa o latest.json que
# já estiver lá e acrescenta a sua plataforma (darwin-aarch64, darwin-x86_64,
# windows-x86_64). O app só enxerga o latest.json depois que o release é publicado.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: --target aarch64-apple-darwin
            alvo: aarch64-apple-darwin
          - plataforma: macos-latest
            args: --target x86_64-apple-darwin
            alvo: x86_64-apple-darwin
          - plataforma: windows-latest
            args: ""
            alvo: ""
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvo }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências do front
        run: npm ci

      - name: Testes do front
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SCORM Builder ${{ github.ref_name }}"
          releaseBody: |
            Veja as novidades e as instruções de instalação no README.

            **Mac:** baixe o `.dmg` do seu processador (Apple Silicon = `aarch64`, Intel = `x64`). O app ainda não é assinado pela Apple: na primeira vez, abra com clique direito → Abrir, ou em Ajustes do Sistema → Privacidade e Segurança → "Abrir Mesmo Assim".
            **Windows:** baixe o instalador `.msi` ou `-setup.exe`. Se o SmartScreen avisar, clique em "Mais informações" → "Executar assim mesmo".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json para o updater (padrão já é true; explícito para não sumir sem aviso).
          includeUpdaterJson: true
          # No Windows a atualização usa o .msi (o mesmo instalador recomendado no README).
          updaterJsonPreferNsis: false

  # Os 3 jobs gravam o mesmo latest.json (lê, acrescenta a plataforma, sobe de novo).
  # Se dois terminarem juntos, uma plataforma pode se perder: aqui isso vira erro visível.
  conferir-latest-json:
    needs: instaladores
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: latest.json tem as 3 plataformas, com assinatura
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
            --jq '.[] | select(.tag_name == env.TAG) | .assets[] | select(.name == "latest.json") | .url' | head -n1)
          if [ -z "$url" ]; then echo "::error::latest.json não foi anexado ao release $TAG"; exit 1; fi
          gh api -H "Accept: application/octet-stream" "$url" > latest.json
          cat latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url and (.platforms[$p].signature | length > 0)' latest.json > /dev/null \
              || { echo "::error::latest.json sem a plataforma $p (rode de novo o job dela)"; exit 1; }
          done
